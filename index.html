<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSS Bitácora</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RSS Bitácora">
<link rel="stylesheet" href="app.css">
<style>
  :root{--bg:#050506;--silver:#d9dde3;--accent:#7fb4ff;--head:64px}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--silver);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}

  /* ===== Splash ===== */
  #splash{position:fixed;inset:0;background:var(--bg);z-index:10;transition:opacity .55s ease}
  #splash.off{opacity:0;pointer-events:none}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #logo{position:fixed;z-index:20;left:0;top:0;opacity:0;border-radius:50%;will-change:transform,width,height;
    -webkit-user-drag:none;user-select:none}
  #shine{position:fixed;z-index:21;left:0;top:0;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:screen;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
</style>
</head>
<body>

<div id="bgl"></div><div id="dim"></div>
<div id="app"><header><h2 id="ttl"></h2></header><div id="v"></div>
<nav><button data-t="d"><b>◐</b>Inicio</button><button data-t="l"><b>☰</b>Bitácora</button><button class="pl" id="nw">＋</button><button data-t="g"><b>▣</b>Galería</button><button data-t="s"><b>⚙</b>Ajustes</button></nav></div>

<div id="splash"><canvas id="gl"></canvas><div id="vig"></div></div>
<img id="logo" alt="RSS" src="logo.jpg">
<div id="shine"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const TOTAL = 3000;           // duración total del splash (ms)
  const T_FORM = 1500;          // partículas terminan de formar el logo
  const T_SHRINK = 2000;        // a los 2 s el logo se reduce hacia el header
  const logoEl = document.getElementById('logo'), shine = document.getElementById('shine');
  const splash = document.getElementById('splash'), app = document.getElementById('app');
  const canvas = document.getElementById('gl');
  const ease = {
    out:t=>1-Math.pow(1-t,3),
    io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
    back:t=>{const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
  };
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

  const img = new Image();
  img.onload = start; img.src = logoEl.src;

  function start(){
    const vw = innerWidth, vh = innerHeight;
    // ---- tamaños del logo: centro -> esquina del header
    const S0 = Math.min(vw, vh) * (vw < 700 ? .72 : .52);
    const S1 = 44;
    const pr=document.createElement('div');pr.style.cssText='position:fixed;top:0;padding-top:env(safe-area-inset-top,0px)';document.body.appendChild(pr);const safeTop=pr.offsetHeight;pr.remove();
    const c0 = {x:vw/2, y:vh/2}, c1 = {x:18+S1/2, y:32+safeTop};
    function placeLogo(cx,cy,s,el){
      el.style.width=el.style.height=s+'px';
      el.style.transform=`translate(${cx-s/2}px,${cy-s/2}px)`;
    }
    placeLogo(c0.x,c0.y,S0,logoEl); placeLogo(c0.x,c0.y,S0,shine);

    // ---- muestreo del logo para formar partículas
    const N = 256, cv = document.createElement('canvas'); cv.width=cv.height=N;
    const cx = cv.getContext('2d'); cx.drawImage(img,0,0,N,N);
    const d = cx.getImageData(0,0,N,N).data, pts=[];
    for(let y=0;y<N;y+=1)for(let x=0;x<N;x+=1){
      const i=(y*N+x)*4, l=(d[i]+d[i+1]+d[i+2])/3;
      if(l>70 && ((x+y*3)%2===0)) pts.push(x/N-.5, -(y/N-.5), l/255);
    }
    const count = pts.length/3;

    // ---- three.js
    const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(vw,vh);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(50,vw/vh,.1,200); cam.position.z=10;
    const worldH = 2*cam.position.z*Math.tan(25*Math.PI/180);
    const W = S0/vh*worldH;     // ancho del logo en unidades de mundo (coincide con la imagen DOM)

    const pos=new Float32Array(count*3), start=new Float32Array(count*3), tgt=new Float32Array(count*3),
          dly=new Float32Array(count), lum=new Float32Array(count);
    for(let i=0;i<count;i++){
      tgt[i*3]=pts[i*3]; tgt[i*3+1]=pts[i*3+1]; tgt[i*3+2]=0; lum[i]=pts[i*3+2];
      const a=Math.random()*Math.PI*2, r=6+Math.random()*14, z=(Math.random()-.5)*30;
      start[i*3]=Math.cos(a)*r; start[i*3+1]=Math.sin(a)*r; start[i*3+2]=z;
      dly[i]=Math.random()*.35;
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('aStart',new THREE.BufferAttribute(start,3));
    geo.setAttribute('aTgt',new THREE.BufferAttribute(tgt,3));
    geo.setAttribute('aDelay',new THREE.BufferAttribute(dly,1));
    geo.setAttribute('aLum',new THREE.BufferAttribute(lum,1));
    const mat=new THREE.ShaderMaterial({
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      uniforms:{uT:{value:0},uW:{value:W},uFade:{value:1},uPx:{value:renderer.getPixelRatio()*vh/900}},
      vertexShader:`
        attribute vec3 aStart,aTgt; attribute float aDelay,aLum;
        uniform float uT,uW,uPx; varying float vP,vL;
        void main(){
          float p=clamp((uT-aDelay)/.65,0.,1.); p=1.-pow(1.-p,3.);
          vec3 t=vec3(aTgt.xy*uW,0.);
          float ang=(1.-p)*3.2+aDelay*6.;
          vec3 s=aStart; float c=cos(ang),sn=sin(ang);
          s.xy=mat2(c,-sn,sn,c)*s.xy;
          vec3 pos=mix(s,t,p);
          pos.z+=sin(aTgt.x*40.+uT*8.)*.03*(1.-p);
          vP=p; vL=aLum;
          vec4 mv=modelViewMatrix*vec4(pos,1.);
          gl_PointSize=(2.2+aLum*2.)*uPx*(18./-mv.z)*(1.+(1.-p)*.8);
          gl_Position=projectionMatrix*mv;
        }`,
      fragmentShader:`
        uniform float uFade; varying float vP,vL;
        void main(){
          float d=length(gl_PointCoord-.5); if(d>.5)discard;
          float a=smoothstep(.5,0.,d);
          vec3 silver=vec3(.85,.88,.93)*(.5+vL*.7);
          vec3 glow=vec3(.35,.62,1.);
          vec3 col=mix(glow,silver,smoothstep(.3,1.,vP));
          gl_FragColor=vec4(col,a*uFade*(.35+.65*vP));
        }`
    });
    scene.add(new THREE.Points(geo,mat));

    // polvo de fondo
    const dn=700, dp=new Float32Array(dn*3);
    for(let i=0;i<dn;i++){dp[i*3]=(Math.random()-.5)*40;dp[i*3+1]=(Math.random()-.5)*25;dp[i*3+2]=-Math.random()*40}
    const dg=new THREE.BufferGeometry(); dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
    const dust=new THREE.Points(dg,new THREE.PointsMaterial({size:.05,color:0x6f8fbf,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
    scene.add(dust);

    // anillo de onda expansiva
    const ring=new THREE.Mesh(new THREE.RingGeometry(.98,1,128),
      new THREE.MeshBasicMaterial({color:0xbcd6ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));
    scene.add(ring);

    // ---- línea de tiempo
    const t0=performance.now(); let done=false;
    function frame(now){
      const t=now-t0, k=t/1000;
      mat.uniforms.uT.value=clamp(t/T_FORM)*1.0;
      cam.position.z=10-ease.out(clamp(t/TOTAL))*1.2;       // pequeño dolly
      cam.position.x=Math.sin(k*1.2)*.25*(1-clamp(t/T_FORM));
      cam.lookAt(0,0,0);
      dust.position.z=k*4; dust.rotation.z=k*.05;

      // revelado del logo real (1.25s–1.75s) + onda + destello
      const rv=clamp((t-1250)/500);
      logoEl.style.opacity=ease.out(rv);
      mat.uniforms.uFade.value=1-ease.out(clamp((t-1400)/450));
      const rr=clamp((t-1300)/650);
      ring.scale.setScalar(W*.5+rr*W*1.4); ring.material.opacity=(1-rr)*.55*(rr>0?1:0);
      // brillo metálico recorriendo el logo
      const sh=clamp((t-1500)/500);
      shine.style.opacity=sh>0&&sh<1?1:0; shine.style.backgroundPosition=`${150-sh*200}% 0`;
      const pulse=1+Math.sin(clamp((t-1250)/500)*Math.PI)*.04;

      // a los 2s: reducción y viaje a la esquina superior izquierda
      let s=S0*pulse,cxp=c0.x,cyp=c0.y;
      if(t>=T_SHRINK){
        const m=ease.io(clamp((t-T_SHRINK)/(TOTAL-T_SHRINK)));
        s=S0+(S1-S0)*m; cxp=c0.x+(c1.x-c0.x)*m; cyp=c0.y+(c1.y-c0.y)*m;
        splash.style.opacity=1-clamp((t-T_SHRINK-150)/600);
        if(m>.25) app.classList.add('on');
      }
      placeLogo(cxp,cyp,s,logoEl); placeLogo(cxp,cyp,s,shine);

      renderer.render(scene,cam);
      if(t<TOTAL) requestAnimationFrame(frame); else finish();
    }
    function finish(){
      if(done)return; done=true;
      placeLogo(c1.x,c1.y,S1,logoEl); logoEl.style.opacity=1; shine.remove();
      splash.classList.add('off'); app.classList.add('on');
      setTimeout(()=>{renderer.dispose();geo.dispose();mat.dispose();splash.remove()},700);
      window.dispatchEvent(new Event('splash:done'));
    }
    addEventListener('resize',()=>{ if(!done) location.reload(); });
    requestAnimationFrame(frame);
  }
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
